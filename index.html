<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favorite Things</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .section {
            background-color: white;
            max-width: 900px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        /* PICTURES */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* AUDIO */
        .audio-item {
            margin-bottom: 25px;
        }

        .audio-item p {
            font-weight: bold;
        }

        audio {
            width: 100%;
        }

        /* VIDEOS */
        .video-item {
            margin-bottom: 30px;
        }

        .video-item p {
            font-weight: bold;
            font-size: 18px;
        }

        video {
            width: 100%;
            max-width: 600px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>My Favorite Things</h1>


    <!-- ========================= -->
    <!-- FAVORITE PICTURES -->
    <!-- ========================= -->

    <div class="section">

        <h2>My Favorite Pictures</h2>

        <div class="gallery">

            <img src="picture1.PNG" alt="Favorite Picture 1">

            <img src="picture2.JPG" alt="Favorite Picture 2">

            <img src="picture3.HEIC" alt="Favorite Picture 3">

            <img src="picture4.HEIC" alt="Favorite Picture 4">

            <img src="picture5.JPG" alt="Favorite Picture 5">

        </div>

    </div>


    <!-- ========================= -->
    <!-- FAVORITE SONGS -->
    <!-- ========================= -->

    <div class="section">

        <h2>My Favorite Songs</h2>


        <div class="audio-item">

            <p>1. Beaches - Beabadoobee</p>

            <audio controls>
                <source src="Beaches.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>

        </div>


        <div class="audio-item">

            <p>2. Glue Song - Beabadoobee</p>

            <audio controls>
                <source src="Glue Song.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>

        </div>


        <div class="audio-item">

            <p>3. Only - LeeHi</p>

            <audio controls>
                <source src="ONLY.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>

        </div>


        <div class="audio-item">

            <p>4. Best Part - Daniel Caesar</p>

            <audio controls>
                <source src="Best Part.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>

        </div>


        <div class="audio-item">

            <p>5. Hold Me Down - Daniel Caesar</p>

            <audio controls>
                <source src="Hold Me Down.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>

        </div>

    </div>


    <!-- ========================= -->
    <!-- TRAVEL DESTINATIONS -->
    <!-- ========================= -->

    <div class="section">

        <h2>My Favorite Travel Destinations</h2>


        <div class="video-item">

            <p>🇯🇵 Japan</p>

            <video controls>
                <source src="japan.mp4.MP4" type="video/mp4">
                Your browser does not support video.
            </video>

        </div>


        <div class="video-item">

            <p>🇰🇷 Korea</p>

            <video controls>
                <source src="korea.mp4.MP4" type="video/mp4">
                Your browser does not support video.
            </video>

        </div>


        <div class="video-item">

            <p>🇨🇭 Switzerland</p>

            <video controls>
                <source src="switzerland.mp4.MP4" type="video/mp4">
                Your browser does not support video.
            </video>

        </div>


        <div class="video-item">

            <p>🇮🇹 Italy</p>

            <video controls>
                <source src="italy.mp4.MP4" type="video/mp4">
                Your browser does not support video.
            </video>

        </div>


        <div class="video-item">

            <p>🇨🇳 China</p>

            <video controls>
                <source src="china.mp4.MP4" type="video/mp4">
                Your browser does not support video.
            </video>

        </div>

    </div>

</body>
</html>
